scope: Sift additions in packages/sift; this is not a complete inventory of other
  Sentry packages or resolved transitive dependencies.
components:
- name: Anthropic skill-creator
  license: Apache-2.0
  source: https://github.com/anthropics/skills/tree/main/skills/skill-creator
  distribution: adapted-source
  version: snapshot incorporated in guixu-labs/sift d00bcb97e85d68234c39b6e16a0aa91ae3344786;
    original Anthropic revision not recorded by upstream Sift
  paths:
  - packages/sift/agents/grader.md
  - packages/sift/agents/comparator.md
  - packages/sift/agents/analyzer.md
  - packages/sift/src/sift/reporting/templates/viewer.html
  - packages/sift/src/sift/reporting/viewer.py (historical derivation; implementation reworked)
  license_file: packages/sift/LICENSES/Apache-2.0.txt
  notice_file: packages/sift/NOTICE.md
- name: typer
  license: MIT
  source: https://github.com/fastapi/typer
  requirement: '>=0.9'
  scope: runtime
  distribution: installed dependency; not vendored
  manifest: packages/sift/pyproject.toml
- name: rich
  license: MIT
  source: https://github.com/Textualize/rich
  requirement: '>=13'
  scope: runtime
  distribution: installed dependency; not vendored
  manifest: packages/sift/pyproject.toml
- name: pydantic
  license: MIT
  source: https://github.com/pydantic/pydantic
  requirement: '>=2.0'
  scope: runtime
  distribution: installed dependency; not vendored
  manifest: packages/sift/pyproject.toml
- name: PyYAML
  license: MIT
  source: https://github.com/yaml/pyyaml
  requirement: '>=6.0'
  scope: runtime
  distribution: installed dependency; not vendored
  manifest: packages/sift/pyproject.toml
- name: pytest
  license: MIT
  source: https://github.com/pytest-dev/pytest
  requirement: '>=7'
  scope: development
  distribution: installed dependency; not vendored
  manifest: packages/sift/pyproject.toml
- name: pytest-mock
  license: MIT
  source: https://github.com/pytest-dev/pytest-mock
  requirement: unconstrained
  scope: development
  distribution: installed dependency; not vendored
  manifest: packages/sift/pyproject.toml
